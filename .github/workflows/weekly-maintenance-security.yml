name: Weekly Maintenance and Security

on:
  schedule:
    - cron: "50 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate static site files
        run: |
          set -euo pipefail
          test -f index.html
          test -f about.html
          test -f services.html
          test -f portfolio.html
          test -f contact.html
          test -f assets/shared.css
          test -f assets/layout.js
          grep -RIn "AKIA\\|BEGIN .*PRIVATE KEY\\|SUPABASE_SERVICE_ROLE\\|STRIPE_SECRET\\|RESEND_API_KEY" . \
            --exclude-dir=.git \
            --exclude-dir=.code-review-graph \
            --exclude=.mcp.json \
            --exclude=.env.ai.local \
            && exit 1 || exit 0
